    /* =========================================
       FLOWER CANVAS
    ========================================= */

    function FlowerCanvas() {


      const canvasRef =

        useRef(null);



      useEffect(() => {


        const canvas =

          canvasRef.current;


        const ctx =

          canvas.getContext("2d");


        let animationId;



        const resize = () => {


          canvas.width =

            window.innerWidth;


          canvas.height =

            window.innerHeight;

        };



        resize();



        window.addEventListener(

          "resize",

          resize

        );



        const petals =

          Array.from(

            { length: 30 },

            () => ({

              x:

                Math.random() *

                canvas.width,

              y:

                Math.random() *

                canvas.height -

                canvas.height,

              r:

                Math.random() * 5 + 3,

              speedY:

                Math.random() * 1 + 1,

              speedX:

                Math.random() * 1 - .5,

              color:

                Math.random() > .5

                  ? "#d4af37"

                  : "#f4c430"

            })

          );



        function draw() {


          ctx.clearRect(

            0,

            0,

            canvas.width,

            canvas.height

          );



          petals.forEach(p => {


            ctx.beginPath();


            ctx.fillStyle =

              p.color;


            ctx.globalAlpha = .6;


            ctx.arc(

              p.x,

              p.y,

              p.r,

              0,

              Math.PI * 2

            );


            ctx.fill();



            p.y += p.speedY;


            p.x += p.speedX;



            if (

              p.y >

              canvas.height

            ) {


              p.y = -10;


              p.x =

                Math.random() *

                canvas.width;

            }

          });



          animationId =

            requestAnimationFrame(draw);

        }



        draw();



        return () => {


          cancelAnimationFrame(

            animationId

          );


          window.removeEventListener(

            "resize",

            resize

          );

        };


      }, []);



      return (

        <canvas

          ref={canvasRef}

          className="fixed inset-0 pointer-events-none z-30"

        />

      );

    }



    /* =========================================
       HERO
    ========================================= */

    function HeroSection() {


      const [timeLeft, setTimeLeft] =

        useState({

          days: 0,

          hours: 0,

          minutes: 0,

          seconds: 0

        });



      useEffect(() => {


        const target =

          new Date(

            WEDDING_DATA.weddingDate

          ).getTime();



        const interval =

          setInterval(() => {


            const difference =

              target -

              new Date().getTime();



            if (

              difference < 0

            ) {


              clearInterval(interval);


              return;

            }



            setTimeLeft({

              days:

                Math.floor(

                  difference /

                  (1000 *

                    60 *

                    60 *

                    24)

                ),

              hours:

                Math.floor(

                  (

                    difference %

                    (1000 *

                      60 *

                      60 *

                      24)

                  ) /

                  (1000 *

                    60 *

                    60)

                ),

              minutes:

                Math.floor(

                  (

                    difference %

                    (1000 *

                      60 *

                      60)

                  ) /

                  (1000 *

                    60)

                ),

              seconds:

                Math.floor(

                  (

                    difference %

                    (1000 *

                      60)

                  ) /

                  1000

                )

            });


          }, 1000);



        return () =>

          clearInterval(interval);


      }, []);



      return (

                {v.name}

              </p>


              <p className="text-stone-500 text-xs mt-1">

                {v.address}

              </p>


              <h4 className="font-bold text-[#4a0e17] mt-6">

                Contact

              </h4>


              {

                v.contacts.map(

                  (c, i) => (


                    <a

                      key={i}

                      href={`tel:${c}`}

                      className="block text-[#4a0e17] font-semibold text-xs mt-2"

                    >

                      📞 {c}

                    </a>


                  )

                )

              }


              <a

                href={v.mapLink}

                target="_blank"

                rel="noreferrer"

                className="block text-center bg-[#4a0e17] text-white py-3 rounded-lg mt-6"

              >

                <i className="fas fa-directions"></i>

                &nbsp; Navigate via Maps

              </a>


            </div>


            <div className="md:col-span-3 h-64 rounded-xl overflow-hidden">


              <iframe

                title="map"

                src={v.mapEmbedUrl}

                className="w-full h-full border-0"

                loading="lazy"

              ></iframe>


            </div>


          </div>


        </section>

      );

    }



    /* =========================================
       GALLERY
    ========================================= */

    function GallerySection() {


      const [index, setIndex] =

        useState(0);



      useEffect(() => {


        const timer =

          setInterval(() => {


            setIndex(

              prev =>

                (

                  prev + 1

                ) %

                WEDDING_DATA.gallery.length

            );


          }, 3000);


        return () =>

          clearInterval(timer);


      }, []);



      return (


        <section className="py-16 px-4 bg-[#f5eedc] text-center">


          <h2 className="font-royal text-2xl text-[#4a0e17] font-bold mb-6">

            Visual Journey

          </h2>


          <div className="relative w-[320px] md:w-[380px] h-[560px] md:h-[680px] mx-auto border-4 border-[#d4af37] p-2 bg-white rounded-2xl shadow-2xl overflow-hidden">


            <img

              src={WEDDING_DATA.gallery[index].url}

              alt={WEDDING_DATA.gallery[index].caption}

              className="w-full h-full object-cover rounded-xl"

            />


            <div className="absolute bottom-5 left-4 right-4 bg-black/60 text-white py-3 rounded-lg text-sm">

              {WEDDING_DATA.gallery[index].caption}

            </div>


            <button

              onClick={() =>

                setIndex(

                  (

                    index -

                    1 +

                    WEDDING_DATA.gallery.length

                  ) %

                  WEDDING_DATA.gallery.length

                )

              }

              className="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/50 text-white"

            >

              ❮

            </button>


            <button

              onClick={() =>

                setIndex(

                  (

                    index + 1

                  ) %

                  WEDDING_DATA.gallery.length

                )

              }

              className="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/50 text-white"

            >

              ❯

            </button>


          </div>


        </section>

      );

    }



    /* =========================================
       BLESSING
    ========================================= */

    function BlessingSection() {


      return (


        <section className="py-20 px-6 bg-[#4a0e17] text-[#fdfbf7] text-center border-t-4 border-b-4 double border-[#d4af37]">


          <p className="font-serif text-lg md:text-xl italic max-w-2xl mx-auto leading-relaxed text-[#f3e5ab]">


            "With the blessings of Lord Ganesha and our beloved elders, we warmly invite you to celebrate this sacred union and bless the couple with your love."


          </p>


        </section>

      );

    }



    /* =========================================
       FOOTER
    ========================================= */

    function Footer() {


      return (


        <footer className="bg-[#210206] text-center py-10 font-sans text-xs">


          <p className="font-serif tracking-wide text-lg text-[#d4af37] mb-2">

            "Your Presence is the Greatest Gift"

          </p>


          <p className="uppercase tracking-widest text-[9px] text-[#f3e5ab]">

            With Love, Bride & Groom Families

          </p>


          <p className="text-[9px] text-stone-500 mt-4">

            Kancherla Family

          </p>


          <div className="mt-6 pt-4 border-t border-[#d4af37]/10 text-[10px] text-stone-400">


            Designed by

            <span className="text-[#f3e5ab] font-medium">

              &nbsp;Bandaru Srinivas

            </span>


            <span className="mx-2">

              |

            </span>


            <a

              href="tel:7386692134"

              className="hover:text-[#d4af37]"

            >

              <i className="fas fa-phone-alt"></i>

              &nbsp;7386692134

            </a>


          </div>


        </footer>

      );

    }



    /* =========================================
       RENDER APP
    ========================================= */

    const root =

      ReactDOM.createRoot(

        document.getElementById("root")

      );


    root.render(

      <App />

    );


  </script>

</body>

</html>
